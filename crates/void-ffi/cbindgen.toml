language = "C"
header = """
/* Generated by cbindgen from crates/void-ffi. Do not edit by hand — run
 * scripts/build_ios.sh (or `cbindgen --crate void-ffi`) to regenerate.
 *
 * This is the boundary described in void-ffi/src/lib.rs: every function here
 * is `catch_unwind`-guarded, every buffer it returns must go back through
 * void_free_bytes, and it never returns key material by value. */
"""
include_guard = "VOID_FFI_H"
autogen_warning = "// AUTO-GENERATED FILE. DO NOT EDIT."
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "type"

[export]
prefix = ""

[enum]
# C enum variants share one global namespace, unlike Rust's — without this,
# `VoidStatus::Offline` and `VoidTickOutcome::Offline` collide as two
# definitions of the same C identifier `Offline`. Prefixing every variant
# with its enum name (`VoidStatusOffline`, `VoidTickOutcomeOffline`) fixes
# that; Swift's importer still recognizes the shared prefix and exposes the
# short form as `.offline` on each type independently.
prefix_with_name = true

[parse]
parse_deps = false
