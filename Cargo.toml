[workspace]
resolver = "2"
members = [
    "crates/void-crypto",
    "crates/void-proto",
    "crates/void-store",
    "crates/void-client",
    "crates/void-relay",
    "crates/void-cli",
    "crates/void-ffi",
    "crates/void-jni",
    "crates/void-tor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
# Nothing here goes to crates.io; this also stops an accidental `cargo publish`.
publish = false
repository = "https://github.com/void-messenger/void"

# NFR-SEC-04: reproducible builds. These settings are part of the documented
# toolchain; changing them changes the artifact hash.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = true

# The libraries the apps link — void-ffi (iOS) and void-jni (Android) — are
# built with this profile, not `release`. Every function they export wraps its
# body in `catch_unwind`, so that a panic in the core becomes an error code the
# app can show instead of a crash. That only works if panics unwind: under
# `release`'s `panic = "abort"` those guards compiled to nothing and any core
# panic killed the app. Otherwise identical to `release`, and held to the same
# reproducibility check (scripts/check_reproducible.sh).
[profile.mobile]
inherits = "release"
panic = "unwind"

[profile.test]
overflow-checks = true
